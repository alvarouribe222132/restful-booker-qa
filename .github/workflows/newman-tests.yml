name: Restful-Booker API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1-5'

jobs:
  run-api-tests:
    name: Ejecutar suite Newman
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman y reporter htmlextra
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Ejecutar pruebas de la API
        run: |
          newman run collections/restful-booker_postman_collection.json \
            --environment environments/restful-booker_postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/reporte-ci.html \
            --reporter-htmlextra-title "Restful-Booker CI Report" \
            --suppress-exit-code

      - name: Guardar reporte HTML como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-newman-${{ github.run_number }}
          path: reports/reporte-ci.html
